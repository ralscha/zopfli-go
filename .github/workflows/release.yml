name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Generate PGO profile
        run: |
          go test -run '^$' -bench 'PureGoGzip/(web-assets-256k|records-logs-256k|real-files-256k)$' \
            -benchtime 2x -cpuprofile cmd/zopfli-go/default.pgo .

      - name: Clean up test binaries
        run: rm -f zopfli-go.test

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}